<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolmer Telis</title>
<meta name="description" content="Rolmer Telis — artigos, repositórios e playlists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #14120F;
    --ink-soft: #1B1815;
    --paper: #EDE7DC;
    --paper-dim: #A79E8E;
    --brass: #B08D4E;
    --brass-dim: #6B5A38;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }

  .field{
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(176,141,78,0.08), transparent 60%),
      var(--ink);
  }

  .monogram{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -52%);
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: min(60vw, 60vh);
    line-height: 1;
    color: var(--ink-soft);
    user-select: none;
    pointer-events: none;
    letter-spacing: -0.02em;
  }

  main{
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .eyebrow{
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 28px;
    opacity: 0;
    animation: rise 1s ease-out 0.2s forwards;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 6vw, 4.2rem);
    letter-spacing: -0.01em;
    color: var(--paper);
    opacity: 0;
    animation: rise 1s ease-out 0.4s forwards;
  }

  .rule-wrap{
    width: 220px;
    height: 14px;
    margin: 30px 0;
  }

  .rule-wrap svg{
    width: 100%;
    height: 100%;
    display: block;
  }

  .rule-wrap path{
    fill: none;
    stroke: var(--brass);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-dasharray: 260;
    stroke-dashoffset: 260;
    animation: draw 1.4s ease-out 1.1s forwards;
  }

  p.desc{
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.7;
    color: var(--paper-dim);
    max-width: 380px;
    opacity: 0;
    animation: rise 1s ease-out 0.6s forwards;
  }

  .cta{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 38px;
    padding: 14px 30px;
    border: 1px solid var(--brass);
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--paper);
    text-decoration: none;
    opacity: 0;
    animation: rise 1s ease-out 0.8s forwards;
    transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
  }

  .cta:hover{
    background: var(--brass);
    color: var(--ink);
    transform: translateY(-2px);
  }

  .cta svg{
    width: 14px;
    height: 14px;
    transition: transform 0.25s ease;
  }

  .cta:hover svg{
    transform: translateX(3px);
  }

  footer{
    position: absolute;
    bottom: 32px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass-dim);
    opacity: 0;
    animation: rise 1s ease-out 1s forwards;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @keyframes draw{
    to{ stroke-dashoffset: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .eyebrow, h1, p.desc, footer{ animation: none; opacity: 1; }
    .rule-wrap path{ animation: none; stroke-dashoffset: 0; }
  }

  @media (max-width: 480px){
    .monogram{ font-size: 80vw; }
  }
</style>
</head>
<body>

<div class="field"></div>
<div class="monogram" aria-hidden="true">RT</div>

<main>
  <div class="eyebrow">Bem-vindo</div>
  <h1>Rolmer Telis</h1>

  <div class="rule-wrap" aria-hidden="true">
    <svg viewBox="0 0 220 14">
      <path d="M4 8 C 40 2, 80 12, 110 7 S 180 2, 216 8" />
    </svg>
  </div>

  <p class="desc">Artigos, repositórios e playlists reunidos em um só lugar.</p>

  <a class="cta" href="site/portal.html">
    Entrar no site
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </a>

  <footer>rolmertelis.com.br</footer>
</main>

</body>
</html>
